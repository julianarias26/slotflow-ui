<header>
  <a routerLink="/" class="logo">SlotFlow</a>
  <span class="tagline">{{ i18n.t().tagline }}</span>

  <button class="lang-toggle" (click)="i18n.toggle()" [attr.aria-label]="'Switch language'">
    <span class="lang-flag">{{ i18n.lang() === 'en' ? '🇪🇸' : '🇬🇧' }}</span>
    <span class="lang-label">{{ i18n.lang() === 'en' ? 'ES' : 'EN' }}</span>
  </button>
</header>

<main>
  <router-outlet />
</main>
